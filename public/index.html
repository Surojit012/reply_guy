<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RG - Reply Guy</title>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0a0a0a;
    color: #ffffff;
    min-height: 100vh;
    line-height: 1.6;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 40px;
    padding: 30px 0;
}

header h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 10px;
    position: relative;
    display: inline-block;
}

.minimalist-logo {
    position: relative;
    display: inline-block;
}

.logo-text {
    color: #ffffff;
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    position: relative;
    z-index: 2;
    animation: subtleGlitch 8s linear infinite;
}

@keyframes subtleGlitch {
    0%, 96%, 100% { 
        transform: translateX(0);
        text-shadow: 0 0 0 transparent;
    }
    97% { 
        transform: translateX(-1px);
        text-shadow: 1px 0 0 rgba(255, 255, 255, 0.3);
    }
    98% { 
        transform: translateX(1px);
        text-shadow: -1px 0 0 rgba(255, 255, 255, 0.3);
    }
    99% { 
        transform: translateX(-0.5px);
        text-shadow: 0.5px 0 0 rgba(255, 255, 255, 0.3);
    }
}

header p {
    color: #888888;
    font-size: 1.1rem;
    font-weight: 400;
}

.creator-badge {
    margin-top: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0.9;
}

.badge-text {
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.9rem;
}

.creator-twitter {
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.05);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
}

.creator-twitter:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
}

.twitter-icon-small {
    font-size: 0.9rem;
}

.creator-name {
    color: #ffffff;
    font-weight: 500;
    font-size: 0.9rem;
}

.input-section, .output-section {
    background: rgba(255, 255, 255, 0.02);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.form-group {
    margin-bottom: 25px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #cccccc;
}

input, textarea, select {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    color: #ffffff;
    font-size: 14px;
    transition: all 0.3s ease;
}

input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.08);
}

textarea {
    resize: vertical;
    min-height: 100px;
}

.preferences-section h3, .analysis-section h3, .output-section h3 {
    color: #ffffff;
    margin-bottom: 20px;
    font-size: 1.2rem;
    font-weight: 600;
}

.checkbox-group {
    display: flex;
    align-items: center;
    margin-top: 32px;
}

.checkbox-label {
    display: flex;
    align-items: center;
    cursor: pointer;
    font-weight: 500;
    color: #cccccc;
}

.checkbox-label input[type="checkbox"] {
    width: auto;
    margin-right: 10px;
    transform: scale(1.2);
}

.button-group {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 30px;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
}

.btn-primary {
    background: #ffffff;
    color: #0a0a0a;
}

.btn-primary:hover:not(:disabled) {
    background: #f0f0f0;
    transform: translateY(-1px);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-secondary:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-1px);
}

.btn-outline {
    background: transparent;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.btn-outline:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-1px);
}

.analysis-box, .reply-box {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    padding: 20px;
    border-left: 3px solid #ffffff;
    margin: 15px 0;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.reply-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
}

.loading {
    text-align: center;
    padding: 40px;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top: 4px solid #ffffff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.error {
    background: rgba(220, 53, 69, 0.1);
    border: 1px solid rgba(220, 53, 69, 0.3);
    color: #f8d7da;
    padding: 15px;
    border-radius: 8px;
    margin: 15px 0;
}

.success {
    background: rgba(40, 167, 69, 0.1);
    border: 1px solid rgba(40, 167, 69, 0.3);
    color: #d4edda;
    padding: 15px;
    border-radius: 8px;
    margin: 15px 0;
}

/* Responsive Design */
@media (max-width: 768px) {
    .container {
        padding: 15px;
    }
    
    .form-row {
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .button-group, .reply-actions {
        flex-direction: column;
        gap: 10px;
    }
    
    .btn {
        width: 100%;
        text-align: center;
    }
    
    header h1, .logo-text {
        font-size: 2.5rem;
    }
    
    .input-section, .output-section {
        padding: 20px;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 10px;
    }
    
    header h1, .logo-text {
        font-size: 2rem;
    }
    
    .input-section, .output-section {
        padding: 15px;
    }
}

/* Extension and FAQ sections - simplified */
.extension-section, .faq-section {
    background: rgba(255, 255, 255, 0.02);
    border-radius: 12px;
    padding: 30px;
    margin: 30px 0;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.extension-header h2, .faq-header h2 {
    font-size: 2rem;
    color: #ffffff;
    margin-bottom: 10px;
    font-weight: 600;
}

.extension-header p, .faq-header p {
    color: #888888;
    font-size: 1.1rem;
}

.creator-section {
    text-align: center;
    margin: 20px 0;
    padding: 10px 0;
}

.creator-text {
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.85rem;
    font-weight: 400;
}

.creator-link {
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    transition: color 0.2s ease;
}

.creator-link:hover {
    color: rgba(255, 255, 255, 0.8);
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="minimalist-logo">
                <span class="logo-text">Reply Guy</span>
            </h1>
            <p>Context-aware Crypto Twitter engagement tool</p>
            <div class="creator-badge">
                <span class="badge-text">Created by</span>
                <a href="https://x.com/surojitpvt" target="_blank" class="creator-twitter">
                    <i data-lucide="twitter" class="twitter-icon-small"></i>
                    <span class="creator-name">@surojitpvt</span>
                </a>
            </div>
        </header>

        <main>
            <div class="input-section">
                <div class="form-group">
                    <label for="tweet-input">Paste the tweet you want to reply to:</label>
                    <textarea id="tweet-input" placeholder="Paste the original tweet here..." rows="4"></textarea>
                </div>

                <div class="analysis-section" id="analysis-section" style="display: none;">
                    <h3><i data-lucide="bar-chart-3"></i> Tweet Analysis</h3>
                    <div id="analysis-result" class="analysis-box"></div>
                </div>

                <div class="preferences-section">
                    <h3><i data-lucide="settings"></i> Crypto Engagement Settings</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="persona-select">Persona:</label>
                            <select id="persona-select">
                                <option value="builder">Builder</option>
                                <option value="trader">Trader</option>
                                <option value="researcher">Researcher</option>
                                <option value="degen">Degen</option>
                                <option value="founder">Founder</option>
                                <option value="community">Community</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="engagement-mode">Engagement Mode:</label>
                            <select id="engagement-mode">
                                <option value="neutral">Neutral</option>
                                <option value="engagement_max">Engagement Max</option>
                                <option value="signal_only">Signal Only</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="reply-length">Length:</label>
                            <select id="reply-length">
                                <option value="ultra-short">Under 10 words</option>
                                <option value="short">Short (1-2 sentences)</option>
                                <option value="medium" selected>Medium (2-3 sentences)</option>
                                <option value="long">Long (3-4 sentences)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="writing-style">Style:</label>
                            <select id="writing-style">
                                <option value="casual" selected>Casual</option>
                                <option value="professional">Professional</option>
                                <option value="friendly">Friendly</option>
                                <option value="witty">Witty</option>
                                <option value="technical">Technical</option>
                                <option value="alpha">Alpha</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="tone">Tone:</label>
                            <select id="tone">
                                <option value="neutral" selected>Neutral</option>
                                <option value="positive">Positive</option>
                                <option value="confident">Confident</option>
                                <option value="contrarian">Contrarian</option>
                                <option value="bullish">Bullish</option>
                                <option value="analytical">Analytical</option>
                                <option value="humorous">Humorous</option>
                            </select>
                        </div>

                        <div class="form-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="include-emoji" checked>
                                <span class="checkmark"></span>
                                Emojis
                            </label>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button id="analyze-btn" class="btn btn-secondary">Analyze</button>
                    <button id="generate-btn" class="btn btn-primary">Generate Reply</button>
                    <button id="variants-btn" class="btn btn-outline">3 Variants</button>
                    <button id="quote-btn" class="btn btn-outline">Quote Tweet</button>
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Generating your perfect reply...</p>
            </div>
        </main>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
