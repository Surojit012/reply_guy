<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RG - Reply Guy</title>
    <link rel="stylesheet" href="popup.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <!-- Interactive Particle Background -->
    <canvas id="particle-canvas-ext"></canvas>
    
    <div class="container">
        <header>
            <h1 class="minimalist-logo">
                <span class="logo-text">Reply Guy</span>
            </h1>
            <p>Context-aware Crypto Twitter engagement tool</p>
        </header>

        <main>
            <div class="input-section">
                <div class="form-group">
                    <label for="tweet-input">Paste the tweet you want to reply to:</label>
                    <textarea id="tweet-input" placeholder="Paste the original tweet here..." rows="3"></textarea>
                    <button id="auto-fill-btn" class="btn btn-secondary btn-small">Auto-fill from Twitter</button>
                </div>

                <div class="analysis-section" id="analysis-section" style="display: none;">
                    <h3><i data-lucide="bar-chart-3"></i> Tweet Analysis</h3>
                    <div id="analysis-result" class="analysis-box"></div>
                </div>

                <div class="preferences-section">
                    <h3><i data-lucide="settings"></i> Crypto Engagement Settings</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="persona-select">Persona:</label>
                            <select id="persona-select">
                                <option value="builder">Builder</option>
                                <option value="trader">Trader</option>
                                <option value="researcher">Researcher</option>
                                <option value="degen">Degen</option>
                                <option value="founder">Founder</option>
                                <option value="community">Community</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="engagement-mode">Engagement Mode:</label>
                            <select id="engagement-mode">
                                <option value="neutral">Neutral</option>
                                <option value="engagement_max">Engagement Max</option>
                                <option value="signal_only">Signal Only</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="reply-length">Length:</label>
                            <select id="reply-length">
                                <option value="ultra-short">Under 10 words</option>
                                <option value="short">Short (1-2 sentences)</option>
                                <option value="medium" selected>Medium (2-3 sentences)</option>
                                <option value="long">Long (3-4 sentences)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="writing-style">Style:</label>
                            <select id="writing-style">
                                <option value="casual" selected>Casual</option>
                                <option value="professional">Professional</option>
                                <option value="friendly">Friendly</option>
                                <option value="witty">Witty</option>
                                <option value="technical">Technical</option>
                                <option value="alpha">Alpha</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="tone">Tone:</label>
                            <select id="tone">
                                <option value="neutral" selected>Neutral</option>
                                <option value="positive">Positive</option>
                                <option value="confident">Confident</option>
                                <option value="contrarian">Contrarian</option>
                                <option value="bullish">Bullish</option>
                                <option value="analytical">Analytical</option>
                                <option value="humorous">Humorous</option>
                            </select>
                        </div>

                        <div class="form-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="include-emoji" checked>
                                <span class="checkmark"></span>
                                Emojis
                            </label>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button id="analyze-btn" class="btn btn-secondary">Analyze</button>
                    <button id="generate-btn" class="btn btn-primary">Generate Reply</button>
                    <button id="variants-btn" class="btn btn-outline">3 Variants</button>
                    <button id="quote-btn" class="btn btn-outline">Quote Tweet</button>
                    <button id="test-connection-btn" class="btn btn-secondary" style="font-size: 12px;">Test Connection</button>
                </div>
            </div>

            <div class="output-section" id="output-section" style="display: none;">
                <h3><i data-lucide="sparkles"></i> Generated Reply</h3>
                <div id="context-info" class="context-info" style="display: none;"></div>
                <div id="generated-reply" class="reply-box"></div>
                <div class="reply-actions">
                    <button id="copy-btn" class="btn btn-outline">Copy</button>
                    <button id="paste-twitter-btn" class="btn btn-secondary">Paste to Twitter</button>
                    <button id="regenerate-btn" class="btn btn-secondary">Regenerate</button>
                </div>
            </div>

            <div class="variants-section" id="variants-section" style="display: none;">
                <h3><i data-lucide="target"></i> Reply Variants</h3>
                <div class="variants-container">
                    <div class="variant-item">
                        <h4><i data-lucide="shield"></i> Safe</h4>
                        <div id="safe-variant" class="reply-box"></div>
                        <button class="btn btn-sm btn-outline copy-variant" data-variant="safe">Copy</button>
                    </div>
                    <div class="variant-item">
                        <h4><i data-lucide="flame"></i> Bold</h4>
                        <div id="bold-variant" class="reply-box"></div>
                        <button class="btn btn-sm btn-outline copy-variant" data-variant="bold">Copy</button>
                    </div>
                    <div class="variant-item">
                        <h4><i data-lucide="zap"></i> Alpha</h4>
                        <div id="alpha-variant" class="reply-box"></div>
                        <button class="btn btn-sm btn-outline copy-variant" data-variant="alpha">Copy</button>
                    </div>
                </div>
            </div>

            <div class="quote-section" id="quote-section" style="display: none;">
                <h3><i data-lucide="message-square-quote"></i> Quote Tweet Generator</h3>
                <div class="quote-preview">
                    <div class="quote-header">
                        <i data-lucide="link" class="quote-icon"></i>
                        <span class="quote-label">Your Quote Tweet</span>
                    </div>
                    <div id="generated-quote" class="quote-box"></div>
                    <div class="quote-footer">
                        <span class="quote-tip"><i data-lucide="lightbulb"></i> Perfect for adding your perspective</span>
                    </div>
                </div>
                <div class="reply-actions">
                    <button id="copy-quote-btn" class="btn btn-outline">Copy Quote Tweet</button>
                    <button id="regenerate-quote-btn" class="btn btn-secondary">Regenerate</button>
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Generating your perfect reply...</p>
            </div>
        </main>
    </div>

    <script src="popup.js"></script>
</body>
</html>
